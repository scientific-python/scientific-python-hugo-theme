{{ with .Site.Params.plausible }}
{{ if .script }}
<script async src="{{ .script }}"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
{{ else if .dataDomain }}
{{ warnf "plausible.dataDomain is deprecated; set plausible.script to your site's script URL instead (see https://plausible.io/docs/script-update-guide)" }}
<script defer data-domain="{{ .dataDomain }}" src="{{ .javaScript }}"></script>
{{ end }}
{{ end }}
