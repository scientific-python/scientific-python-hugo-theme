name: Link check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays 06:00 UTC, so link rot is caught even without PR activity
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            'doc/content/**/*.md'
            'exampleSite/content/**/*.md'
            'README.md'
            'CHANGELOG.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
